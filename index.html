<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Pocket Experimental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: mesa de jogo navy, uma carta branca por vez, placar fixo no topo */
:root{--navy:#09274D;--navy-d:#061A36;--navy-l:#123A6B;--teal:#12B8BB;--yellow:#FFC12E;--paper:#FFFFFF;--ink:#0B2140;--mute:#5A6B85;--line:#D5DEEA;--good:#16864F;--bad:#C93A52;--pink:#FDE3EA;--blue:#DCEAFD;--green:#DAF3E3;--on-navy:#EAF1FA;--on-navy-mute:#9DB2CF;
 --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--navy);color:var(--on-navy);font-family:var(--font);font-size:17px;line-height:1.45;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:800;color:var(--ink);background:var(--paper);min-height:52px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-y{background:var(--yellow)}
.btn-t{background:var(--teal);color:#032a30}
.btn-g{background:transparent;color:var(--on-navy);border:2px solid var(--on-navy-mute)}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top img{height:34px;max-width:50%;object-fit:contain}
.top .ghost{min-height:40px;padding:8px 12px;font-size:14px;flex:0 0 auto}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--navy-l);border-radius:16px;padding:10px 14px;border:3px solid transparent;min-width:0}
.chip small{display:block;color:var(--on-navy-mute);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.chip b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--yellow)}
.chip.t1.on{border-color:var(--teal)}
.who{background:var(--navy-l);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px}
.who b{color:var(--yellow)}
.card{background:var(--paper);color:var(--ink);border-radius:22px;overflow:hidden}
.banner{background:var(--navy-d);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px}
.num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:20px}
.banner .t{flex:1;min-width:0}
.banner small{display:block;color:var(--teal);font-weight:800;letter-spacing:.08em;font-size:12px;text-transform:uppercase}
.banner h2{font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.banner img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:16px;border:3px solid #fff;flex:0 0 auto}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.lab{color:var(--teal);font-weight:900;letter-spacing:.08em;font-size:13px;text-transform:uppercase;filter:brightness(.8)}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:#F2F6FB;border:2px solid transparent;text-align:left;width:100%;font-weight:600;min-height:0;color:var(--ink)}
.clue .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#032a30;font-weight:900;display:grid;place-items:center;font-size:15px}
.clue p{min-width:0;overflow-wrap:anywhere}
.clue.lock{background:transparent;border:2px dashed var(--line);color:var(--mute);align-items:center}
.clue.lock .n{background:var(--line);color:var(--mute)}
.clue.pick{cursor:pointer}
.clue.pick:hover{border-color:var(--yellow)}
.clue.sel{border-color:var(--ink)}
.clue.fake{background:#FFF1CF;border-color:var(--yellow)}
.clue.fake .n{background:var(--yellow);color:var(--ink)}
.tag{display:inline-block;background:var(--yellow);color:var(--ink);font-size:12px;font-weight:900;border-radius:8px;padding:2px 8px;margin-top:4px}
.hr{border:0;border-top:3px dotted var(--line);margin:0}
.msg{border-radius:12px;padding:10px 12px;font-weight:700;background:#EEF3FA}
.msg.good{background:#DCF3E6;color:#0E5B34}
.msg.bad{background:#FBE0E5;color:#8E2438}
.keybox{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.keybox b{color:var(--yellow)}
.keybtn{background:var(--navy-l);color:var(--on-navy);min-height:44px;padding:10px 14px;font-size:15px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px;border-radius:14px;font-weight:700;color:var(--ink);border:3px solid transparent}
.opt .l{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-weight:900}
.opt span.x{min-width:0;overflow-wrap:anywhere}
.opt.A{background:var(--pink)}.opt.B{background:var(--blue)}.opt.C{background:var(--green)}
.opt.sel{border-color:var(--ink)}
.opt .pts{margin-left:auto;flex:0 0 auto;font-weight:900;border-radius:8px;padding:2px 8px;background:var(--ink);color:#fff;font-size:14px}
.opt.best .pts{background:var(--good)}
.opt.worst .pts{background:var(--bad)}
.why{font-weight:500;font-size:15px;margin-top:2px;display:block}
.sum{display:flex;flex-direction:column;gap:4px;font-weight:700}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{border-top:2px solid var(--line);padding-top:6px;font-size:20px;font-weight:900}
.in{display:flex;gap:8px}
.in input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:#fff;font-weight:700}
.in button{flex:0 0 auto}
.setup label,.fb label{display:block;font-weight:800;margin-bottom:4px;color:var(--ink)}
.setup input[type=text],.fb input[type=text],.fb textarea,.fb select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:#fff;font-weight:600}
.fb textarea{min-height:90px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{margin:0;flex:1 1 130px;font-weight:700}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:48px}
.seg input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode label{margin:0}
.mode span{padding:14px 10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.mode small{font-weight:600;font-size:13px;opacity:.85}
.hint{font-size:14px;color:var(--mute);font-weight:600}
.small{font-size:14px}
.win{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.win h2{font-size:28px;text-wrap:balance}
.big{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600}
.log div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:#F2F6FB;border-radius:10px}
.log div span:first-child{min-width:0;overflow-wrap:anywhere}
textarea.out{width:100%;min-height:200px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:#fff}
.stack{display:flex;flex-direction:column;gap:10px}
.rules li{margin-bottom:4px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}

.lifes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.life{border:2px solid var(--yellow);background:#FFF8E1;color:var(--ink);border-radius:12px;padding:8px 6px;font:800 14px Nunito,sans-serif;cursor:pointer;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.life small{font-weight:600;font-size:11px;color:var(--mute)}
.life.used,.life:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}

/* Microinterações discretas (design-taste): hover sobe 2px, clique afunda, tudo parado se reduzir movimento */
@media (hover:hover){button:not(:disabled):hover,.seg span:hover{transform:translateY(-2px)}.opt:not(:disabled):hover{transform:translateY(-2px)}}
button:not(:disabled):active{transform:translateY(1px) scale(.99)}
button,.seg span,.opt{transition:transform .12s ease-out,box-shadow .12s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:hover,button:active,.seg span:hover{transform:none!important}}
.msg{scroll-margin-top:12px}
@media (max-width:360px){body{font-size:16px}.lifes{gap:6px}.life{padding:6px 4px;font-size:13px}.life small{font-size:10px}}
.top-b{min-height:44px;padding-inline:16px}

/* Acessibilidade (WCAG AA): contraste dos rótulos, título oculto, texto de apoio */
.lab{color:#0A5F61;filter:none}
.banner small{color:#5FE0E2}
.hint{color:#3D4F66}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function hasTok(n,words,t){if(t.includes(' '))return n.includes(t);return words.some(w=>w.startsWith(t)||(t.length>=5&&w.length>=t.length&&lev(w.slice(0,t.length),t)<=1))}
function evalGuess(c,g){const n=norm(g);if(!n)return null;const words=n.split(' ');const x=EXTRA[c.title]||{};
 for(const m of c.correct.map(norm)){if(n===m||n.includes(m))return'ok'}
 for(const set of (x.sets||[])){if(set.every(t=>hasTok(n,words,t)))return'ok'}
 for(const m of c.near.map(norm)){if(n===m||n.includes(m))return'near'}
 return'bad'}

function viewFinal(){const [a,b]=S.score;const w=a===b?'Empate: vitória dividida!':(a>b?S.names[0]:S.names[1])+' venceu!';
 const mins=Math.max(1,Math.round(((S.t1||Date.now())-S.t0)/60000));
 return `${logo()}<div class="card"><div class="banner"><div class="num">★</div><div class="t"><small>Fim da partida</small><h2>${esc(w)}</h2></div></div><div class="body">
 <p class="hint" style="color:var(--ink)">Conceitos descobertos até agora: ${albumN()} de ${CARDS.length}.</p><div class="score"><div class="chip"><small>${esc(S.names[0])}</small><b>${a}</b></div><div class="chip t1"><small>${esc(S.names[1])}</small><b>${b}</b></div></div>
 <p class="small">Partida de ${mins} min. Pontos negativos podem acontecer: a escolha também ensina.</p>
 <div class="lab">Cartas jogadas</div><div class="log">${S.log.map(l=>`<div><span>${l.round+1}. ${esc(l.title)} (${esc(S.names[l.t])})</span><span>${l.tot>0?'+':''}${l.tot}</span></div>`).join('')}</div>
 <button class="btn-y full" onclick="ph='fb';render()">Contar o que acharam</button><button class="btn-g full" style="color:var(--ink);border-color:var(--line)" onclick="ph='setup';render()">Jogar de novo</button></div></div>`}
function seg(name,opts){return `<div class="seg">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`}
function viewFb(){const played=[...new Set(S.log.filter(l=>!l.bot).map(l=>l.title))];
 return `${logo()}<div class="card fb"><div class="banner"><div class="num">?</div><div class="t"><small>Percepções do teste</small><h2>O que acharam?</h2></div></div><div class="body">
 <p class="hint">Um adulto pode preencher junto com as crianças. Use só o primeiro nome.</p>
 <div class="row"><div><label for="f_who">Quem jogou</label><input id="f_who" type="text" placeholder="Ex.: Caio e Mel"></div><div><label for="f_age">Idades</label><input id="f_age" type="text" placeholder="Ex.: 8 e 10"></div></div>
 <div><label>Foi divertido?</label>${seg('fun',['Muito','Mais ou menos','Pouco','Nada'])}</div>
 <div><label>As regras</label>${seg('rules',['Entenderam sozinhos','Precisaram de ajuda','Não entenderam'])}</div>
 <div><label>Teve palavras difíceis?</label>${seg('vocab',['Muitas','Algumas','Nenhuma'])}</div>
 <div><label>A pista falsa</label>${seg('fake',['Divertida','Confusa','Ignoraram'])}</div>
 <div><label>Cena e escolha (A, B, C)</label>${seg('scene',['Fez sentido','Confusa','Pontos injustos'])}</div>
 <div><label>As ajudas (Dica, Opções, Pista falsa)</label>${seg('help',['Ajudaram','Atrapalharam','Não usamos','Estavam desligadas'])}</div>
 <div><label>A dica quando o palpite estava perto</label>${seg('nudge',['Ajudou','Não ajudou','Não aconteceu'])}</div>
 <div><label>O ritmo da partida</label>${seg('pace',['Rápido demais','Bom','Demorou'])}</div>
 <div><label for="f_hard">Carta mais difícil</label><select id="f_hard"><option value="">Nenhuma</option>${played.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
 <div><label for="f_fav">Carta preferida</label><select id="f_fav"><option value="">Nenhuma</option>${played.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
 <div><label>Querem jogar de novo?</label>${seg('again',['Sim','Talvez','Não'])}</div>
 <div><label for="f_note">O que disseram ou fizeram que chamou atenção?</label><textarea id="f_note" placeholder="Frases das crianças, dúvidas, momentos de empolgação ou tédio"></textarea></div>
 <button id="savebtn" class="btn-y full" onclick="saveFb()">Ver resumo para enviar</button></div></div>`}
async function saveFb(){const g=n=>{const e=document.querySelector(`input[name=${n}]:checked`);return e?e.value:''};
 const d={ver:'v3',date:new Date().toISOString(),mode:S.mode,rule:S.rule,helps:!!S.helps,names:S.names,score:S.score,min:Math.max(1,Math.round(((S.t1||Date.now())-S.t0)/60000)),log:S.log,
  who:$('f_who').value,age:$('f_age').value,fun:g('fun'),rules:g('rules'),vocab:g('vocab'),fake:g('fake'),scene:g('scene'),help:g('help'),nudge:g('nudge'),pace:g('pace'),hard:$('f_hard').value,fav:$('f_fav').value,again:g('again'),note:$('f_note').value};
 const btn=$('savebtn');btn.disabled=true;
 view.saved=d;view.saveErr='aberto';
 ph='saved';render()}
function reportText(all){return all.map((d,i)=>{const dt=new Date(d.date).toLocaleString('pt-BR');
 return `PARTIDA ${i+1} - ${dt}\nJogaram: ${d.who||'-'} (${d.age||'-'} anos)\nModo: ${d.mode==='solo'?'1 pessoa contra o jogo':'equipe contra equipe'} | Regra ${d.rule} | Ajudas ${d.helps?'ligadas':'desligadas'} | ${d.min} min\nPlacar: ${d.names[0]} ${d.score[0]} x ${d.score[1]} ${d.names[1]}\nDiversão: ${d.fun||'-'} | Regras: ${d.rules||'-'} | Palavras difíceis: ${d.vocab||'-'} | Pista falsa: ${d.fake||'-'}\nCena e escolha: ${d.scene||'-'} | Ajudas: ${d.help||'-'} | Dica no quase: ${d.nudge||'-'} | Ritmo: ${d.pace||'-'} | Jogar de novo: ${d.again||'-'}\nMais difícil: ${d.hard||'-'} | Preferida: ${d.fav||'-'}\nCartas: ${d.log.map(l=>`${l.title} [${l.tot>0?'+':''}${l.tot}${l.k?', pista '+l.k:', sem acerto'}${l.bonus?', falsa ok':''}${l.life?', ajuda '+l.life:''}]`).join('; ')}\nObservações: ${d.note||'-'}`}).join('\n\n----\n\n')}
function viewSaved(){const t=reportText([view.saved]);const url='https://wa.me/5521981133669?text='+encodeURIComponent('Feedback Missão Dinheiro Pocket\n\n'+t);
 return `${logo()}<div class="card"><div class="banner"><div class="num">✓</div><div class="t"><small>Obrigado!</small><h2>Envie suas percepções</h2></div></div><div class="body"><p class="small">Toque no botão para abrir o WhatsApp com o resumo já escrito e é só enviar. Se não abrir, use "Copiar resumo" e cole na conversa.</p><a class="btn-t full" style="display:block;text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a><textarea class="out" id="out" readonly aria-label="Resumo do teste para copiar">${esc(t)}</textarea><button class="btn-t full" onclick="copyOut()">Copiar resumo</button><div id="cp" class="hint"></div><button class="btn-y full" onclick="ph='setup';render()">Voltar ao início</button></div></div>`}
function copyOut(){const el=$('out');const t=el.value;const done=()=>{$('cp').textContent='Copiado.'};
 const fb=()=>{el.focus();el.select();$('cp').textContent='Texto selecionado. Use Copiar do aparelho.'};
 try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}}
async function showResults(){const el=$('rep');el.innerHTML='<p class="hint">Carregando…</p>';
 try{const snap=await DB.collection('sessions').get();const games=[];snap.docs.forEach(dc=>{((dc.data()||{}).games||[]).forEach(g=>games.push(g))});
  games.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const tally=f=>{const m={};games.forEach(g=>{const v=g[f]||'sem resposta';m[v]=(m[v]||0)+1});return Object.entries(m).map(([k,v])=>`${esc(k)} ×${v}`).join(' · ')||'-'};
  const lifes={};games.forEach(g=>(g.log||[]).forEach(l=>{if(l.life)lifes[l.life]=(lifes[l.life]||0)+1}));
  const L=[['Diversão','fun'],['Regras','rules'],['Palavras difíceis','vocab'],['Pista falsa','fake'],['Cena e escolha','scene'],['Ajudas','help'],['Dica no quase','nudge'],['Ritmo','pace'],['Jogar de novo','again'],['Carta mais difícil','hard'],['Carta preferida','fav']];
  el.innerHTML=`<div class="stack" style="margin-top:10px"><p><b>${games.length}</b> partida(s) salvas.</p>${L.map(([n,f])=>`<p class="small"><b>${n}:</b> ${tally(f)}</p>`).join('')}<p class="small"><b>Ajudas usadas:</b> ${Object.entries(lifes).map(([k,v])=>`${esc(k)} ×${v}`).join(' · ')||'nenhuma'}</p><div class="log">${games.map(g=>`<div><span>${esc(new Date(g.date).toLocaleDateString('pt-BR'))} · ${esc(g.who||'-')} (${esc(g.age||'-')}) · ${esc(g.mode==='solo'?'solo':'equipes')} · ${g.helps?'com ajudas':'sem ajudas'}${g.note?'<br>'+esc(g.note):''}</span><span>${g.score[0]}x${g.score[1]}</span></div>`).join('')}</div></div>`}
 catch(e){el.innerHTML='<p class="hint">Não foi possível carregar os resultados agora.</p>'}}
function render(){
 const app=$('app');let h='';
 if(ph==='setup')h=viewSetup();
 else if(ph==='tut')h=viewTut();
 else if(ph==='final')h=viewFinal();
 else if(ph==='fb')h=viewFb();
 else if(ph==='saved')h=viewSaved();
 else{const c=card();h=logo()+topbar()+scoreboard();
  if(ph==='clues')h+=viewClues(c);else if(ph==='falseq')h+=viewFalse(c);else if(ph==='reveal')h+=viewReveal(c);
  else if(ph==='scene')h+=viewScene(c,false);else if(ph==='sceneRes')h+=viewScene(c,true);else if(ph==='bot')h+=viewBot(c);
  persist()}
 app.innerHTML=h;
 if(ph==='setup'){setupChange();updConn();const al=$('album');if(al)al.textContent='Conceitos que você já descobriu: '+albumN()+' de '+CARDS.length+'.'}
 window.scrollTo(0,0)}
ph=store.get(KEY_TUT)?'setup':'tut';
render();
init();
</script>
</body></html>
